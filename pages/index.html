<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreaddBase</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>

<body>

    <!-- Registration section -->
    <div class="register-container">
        <div class="register-text">
            Keep up with the <span>Discussions.</span>
        </div>
        <div class="register-tab">
            <h2>Create your <span>account</span></h2>

            <div class="input-row">
                <div class="input-section">
                    <label for="firstname">First Name</label>
                    <input type="text" id="firstname" placeholder="Enter First name" />
                </div>
                <div class="input-section">
                    <label for="lastname">Last Name</label>
                    <input type="text" id="lastname" placeholder="Enter Last name" />
                </div>
            </div>

            <div class="input-section">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="What would you like to be called as?" />
            </div>

            <div class="input-section">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="abc@gmail.com" />
            </div>

            <div class="input-section">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="*********" />
            </div>

            <div class="input-section">
                <label for="repass">Confirm Password</label>
                <input type="password" id="repass" placeholder="*********" />
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" />
                <label for="terms">
                    I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>
                </label>
            </div>

            <button class="btn-submit">Create Account</button>

            <div class="login-link">
                Already have an account? <a href="#">Sign in</a>
            </div>
        </div>
    </div>

    <!-- CTA section -->
     <div class="CTA-section">
        <div class="CTA-image"></div>
        <div class="CTA-text">
            <p>Where every voice finds its thread.
            Join the discussion,<span>
                Start a Thread.
            </span> 
                
            </p>
            <button>Share Your Thoughts -></button>
        </div>
     </div>
</body>

</html>
