<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | ThreaddBase</title>
  <link rel="stylesheet" href="../CSS/util.css" />
  <link rel="stylesheet" href="../CSS/settings.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>

<body>
  <header class="navbar">
    <div class="menu">☰</div>
  </header>

  <section class="profile-header">
    <div class="profile-inner">
      <div class="avatar"></div>
      <div class="user-info">
        <h2>Harry Newgate</h2>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit.</p>
      </div>
      <button class="edit-btn">Edit Profile</button>
    </div>
  </section>

  <nav class="tabs">
    <div class="tabs-inner">
      <a href="user.html">Profile</a>
      <a href="joined.html">Joined Communities</a>
      <a href="bookmark.html">Bookmark</a>
      <a href="notifications.html">Notification</a>
      <a href="settings.html" class="active">Settings</a>
    </div>
  </nav>

  <div class="title">
    <div class="title-heading">
      <h1>Settings</h1>
    </div>
  </div>

  <section class="posts settings-list">
    <article class="post setting-item">
      <div class="post-left">
        <div>
          <h4>Public Fullname</h4>
        </div>
      </div>
      <div class="post-buttons">
        <label class="toggle-switch">
          <input type="checkbox" checked />
          <span class="slider"></span>
        </label>
      </div>
    </article>

    <article class="post setting-item">
      <div class="post-left">
        <div>
          <h4>Public email address</h4>
        </div>
      </div>
      <div class="post-buttons">
        <label class="toggle-switch">
          <input type="checkbox" checked />
          <span class="slider"></span>
        </label>
      </div>
    </article>

    <article class="post setting-item">
      <div class="post-left">
        <div>
          <h4>Public profile picture</h4>
        </div>
      </div>
      <div class="post-buttons">
        <label class="toggle-switch">
          <input type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </article>

    <article class="post setting-item">
      <div class="post-left">
        <div>
          <h4>Public joined communities</h4>
        </div>
      </div>
      <div class="post-buttons">
        <label class="toggle-switch">
          <input type="checkbox" checked />
          <span class="slider"></span>
        </label>
      </div>
    </article>

    <article class="post setting-item">
      <div class="post-left">
        <div>
          <h4>Public Bookmarks</h4>
        </div>
      </div>
      <div class="post-buttons">
        <label class="toggle-switch">
          <input type="checkbox" checked />
          <span class="slider"></span>
        </label>
      </div>
    </article>

    <article class="post setting-item">
      <div class="post-left">
        <div>
          <h4>Enable Notifications</h4>
        </div>
      </div>
      <div class="post-buttons">
        <label class="toggle-switch">
          <input type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </article>

    <div class="post-footer">
      <button class="save-button">Save Settings</button>
    </div>
  </section>
</body>

</html>
