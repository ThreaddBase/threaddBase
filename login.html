<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
   <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=eye_tracking" />
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close" />
    
    
</head>
<body>
    
    <div class ="login_page"> 

        <form action="">
            <h1> Login Page</h1>
            
        <div class="input-box">
            <label>Email</label>
            <input type ="text" placeholder="name@email.com" required>
        </div>
        <div class="input-box">
            <label>Password</label>
            <div class="wrapper">
            <input type ="password" id="password" placeholder="Password" required> 
            <span class="material-symbols-outlined" > eye_tracking </span>
            </div>
            </div>
        <div class="forget">
            <a href="#"> Forgot your Password ?</a>
        </div>
        <button type="submit" class ="btn"> Log in</button>
        </form>
    </div>
</body>
</html>
